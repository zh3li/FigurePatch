[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figurepatch"
version = "0.1.0"
description = "Compose multi-panel Matplotlib figures with | and / operators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["matplotlib>=3.8"]
classifiers = [
  "Framework :: Matplotlib",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/zh3li/FigurePatch"
Repository = "https://github.com/zh3li/FigurePatch"
Issues = "https://github.com/zh3li/FigurePatch/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/figurepatch", "src/figpatch"]
