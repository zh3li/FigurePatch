[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figurepatch"
dynamic = ["version"]
description = "Compose multi-panel Matplotlib figures with | and / operators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zhe Li" }]
dependencies = ["matplotlib>=3.9", "numpy>=1.23"]
keywords = [
  "matplotlib",
  "figures",
  "publication",
  "panels",
  "layout",
  "visualization",
  "science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Matplotlib",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/zh3li/FigurePatch"
Repository = "https://github.com/zh3li/FigurePatch"
Issues = "https://github.com/zh3li/FigurePatch/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/figurepatch/__init__.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/figurepatch", "src/figpatch"]
